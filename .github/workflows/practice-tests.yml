name: Interview practice tests
on:
  push:
    paths:
      - 'practice.py'
      - 'test_practice.py'
      - 'questions/high-yield/**'
      - '.github/workflows/practice-tests.yml'
  pull_request:
    paths:
      - 'practice.py'
      - 'test_practice.py'
      - 'questions/high-yield/**'
      - '.github/workflows/practice-tests.yml'
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest -v test_practice.py
      - run: python -m py_compile practice.py test_practice.py
